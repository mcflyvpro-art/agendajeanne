<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agenda Jeanne — hors ligne</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #FAF7FF; color: #2E2445; text-align: center; padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .box { max-width: 22rem; }
  img { width: 84px; height: 84px; border-radius: 24px; }
  h1 { font-size: 1.5rem; font-weight: 900; margin: 1.25rem 0 .5rem; }
  p { font-weight: 600; color: #6B5F86; line-height: 1.5; margin: 0 0 1.5rem; }
  button {
    border: 0; border-radius: 20px; background: #7C4DEE; color: #fff;
    font: inherit; font-weight: 800; padding: .9rem 1.6rem; box-shadow: 0 5px 0 #5B34C4;
    cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #5B34C4; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="" />
    <h1>Pas de connexion</h1>
    <p>L’agenda a besoin du réseau pour rester synchronisé entre les appareils. Il se remettra à jour tout seul dès le retour de la connexion.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
